[package]
name = "rubik-vision-ml"
version = "0.1.0"
edition = "2021"
description = "Dò vị trí mặt cube bằng CNN nhỏ (ONNX Runtime qua crate `ort`) — THỬ NGHIỆM, tách riêng khỏi workspace chính."

# Crate này là thành viên của workspace gốc (một Cargo.lock duy nhất). `ort` bản 2.0 RC cần Rust
# khá mới (~1.88+). Nếu build toàn bộ workspace lỗi vì `ort` (máy/CI khác), cách lùi nhanh nhất:
# bỏ "rubik-vision-ml" khỏi `members` ở Cargo.toml gốc và thêm dòng `[workspace]` rỗng vào file này
# để build riêng bằng `cd rubik-vision-ml && cargo build`. rubik-app KHÔNG phụ thuộc vào crate này
# trừ khi bật feature `ml_detect`. Xem README.md của crate để biết cách nối vào rubik-app.

[dependencies]
rubik-vision = { path = "../rubik-vision" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ort = "=2.0.0-rc.13"
ndarray = "0.17"
