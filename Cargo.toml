[workspace]
resolver = "2"
members = ["rubik-core", "rubik-app", "rubik-vision", "rubik-vision-ml", "rubik-api", "rubik-wasm", "rubik-web"]

[profile.release]
opt-level = 3
lto = true
# codegen-units = 1: cho LLVM tối ưu xuyên suốt cả crate thay vì chia nhỏ
# song song -- build release lâu hơn 1 chút nhưng code máy chạy nhanh hơn,
# quan trọng cho các vòng search (F2L/OLL/PLL) vốn là phần tốn CPU nhất.
codegen-units = 1
# strip = true: cắt debug symbol khỏi bản release -- file .exe nhỏ hơn,
# không ảnh hưởng tốc độ chạy. Muốn xem backtrace lúc debug thì tạm bỏ
# dòng này rồi build lại.
strip = true

# Bản debug (`cargo run` không kèm --release) mặc định KHÔNG tối ưu gì, làm phần
# xử lý ảnh camera chậm ~12 lần (đo: 89 ms so với 7 ms mỗi khung hình), vượt
# ngân sách 66 ms của luồng 15 fps -> giật trên máy yếu. Luôn tối ưu các crate
# nặng tính toán + toàn bộ thư viện phụ thuộc (image, egui, three-d...); code
# của app (rubik-app) vẫn ở chế độ debug nên build lại nhanh và vẫn gỡ lỗi được.
[profile.dev.package."*"]
opt-level = 3
[profile.dev.package.rubik-vision]
opt-level = 3
[profile.dev.package.rubik-core]
opt-level = 3
