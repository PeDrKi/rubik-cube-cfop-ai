[package]
name = "rubik-web"
version = "0.1.0"
edition = "2021"
description = "Bản server (axum) của bộ giải Rubik, dùng chung logic với bản WebAssembly qua rubik-api"

[dependencies]
rubik-api = { path = "../rubik-api" }
# Khai báo thẳng để bật feature "parallel" (mặc định) cho bản server: giải nhanh hơn nhờ rayon.
rubik-core = { path = "../rubik-core" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tài khoản & bảng xếp hạng: SQLite nhúng sẵn (bundled, không cần cài gì thêm), mật khẩu băm Argon2.
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"

[lib]
name = "rubik_web"
path = "src/lib.rs"

[[bin]]
name = "rubik-web"
path = "src/main.rs"

[dev-dependencies]
# Test HTTP: gọi thẳng router trong bộ nhớ (không mở cổng mạng).
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
