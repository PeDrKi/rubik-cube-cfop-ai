[package]
name = "rubik-wasm"
version = "0.1.0"
edition = "2021"
description = "Bản WebAssembly của bộ giải Rubik: chạy hoàn toàn trong trình duyệt"

[lib]
crate-type = ["cdylib"]

[dependencies]
rubik-api = { path = "../rubik-api" }
wasm-bindgen = "0.2"
serde_json = "1"
# Bật feature "js" để rand/getrandom biên dịch được trên wasm32-unknown-unknown
getrandom = { version = "0.2", features = ["js"] }
